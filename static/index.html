<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>YTchat</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>YTchat</h1>
    <form id="load-form" class="url-row">
      <input id="url" type="text" placeholder="Paste a YouTube URL..." />
      <button id="load-btn" type="submit">Load</button>
    </form>
  </header>

  <p id="status"></p>

  <main class="app-grid">
    <div class="left-col">
      <section class="card player-card" id="player-section" hidden>
        <div class="player-wrap"><div id="player"></div></div>
      </section>

      <section class="card">
        <div class="section-label">Summary</div>
        <button id="summary-btn" disabled>Summarize</button>
        <div id="summary-out"></div>
      </section>
    </div>

    <section class="card chat-card">
      <div class="section-label">Chat</div>
      <div id="messages"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Ask about the video..." disabled />
        <button id="send-btn" disabled>Send</button>
      </form>
    </section>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/static/app.js"></script>
</body>
</html>
